# ~/.config/tmux/tmux.conf — dotfiles
# Sem plugins/tpm: funciona em termux, proot e alpine sem nada extra.
#
# CHEAT SHEET (prefixo = Ctrl+a):
#   sessões   s = listar/trocar   N = nova sessão (pergunta o nome)
#             T = renomear        K = encerrar sessão   d = sair (detach)
#   janelas   c = nova            n/p = próxima/anterior  1..9 = ir para
#   painéis   | = dividir lado a lado     - = dividir cima/baixo
#             h j k l = mover entre painéis (Alt+hjkl sem prefixo)
#             H J K L = redimensionar     z = zoom no painel
#   copiar    v = selecionar   y = copiar (vai pro clipboard do android)
#   config    r = recarregar este arquivo

# --- prefixo ---------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix        # tmux dentro de tmux: Ctrl+a a manda o C-a adiante

# --- básico ----------------------------------------------------------------
set -g history-limit 50000
set -sg escape-time 0     # sem delay no Esc (vim/neovim respondem na hora)
set -g repeat-time 600
set -g focus-events on
set -g mouse on           # scroll, clique e seleção com o dedo no termux
set -g base-index 1       # janelas começam no 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -ga terminal-overrides ",*:Tc"   # true color (termux/alpine)

# --- painéis: dividir e navegar --------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# sem prefixo também: Alt + hjkl pula de painél direto
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# redimensionar (repetição: segure o prefixo e aperte várias vezes)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- janelas ---------------------------------------------------------------
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- sessões: o pulo do gato pro proot --------------------------------------
# abra várias sessões ("ta teste", "ta experimento") e troque com `s`
# sem sair do proot alpine
bind N command-prompt -p "nova sessão:" "new-session -A -s '%%'"
bind T command-prompt -p "renomear sessão:" "rename-session '%%'"
bind K confirm-before -p "encerrar a sessão '#S'?" "kill-session"

# --- copiar/colar (modo vi) --------------------------------------------------
setw -g mode-keys vi
set -s set-clipboard on   # osc52: o termux leva a cópia pro clipboard do android
bind Escape copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# --- recarregar --------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"

# --- status bar --------------------------------------------------------------
set -g status-interval 5
set -g status-style "bg=default,fg=white"

# esquerda: nome da sessão em destaque (é o que você mais usa)
set -g status-left-length 40
set -g status-left "#[fg=black,bg=green,bold] #S #[fg=default,bg=default] "

# centro: janelas abertas, a atual em destaque
setw -g window-status-format "#[fg=white] #I:#W "
setw -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:#W "

# direita: quantas sessões/janelas + hora
set -g status-right-length 60
set -g status-right "#[fg=white]#{session_windows} janelas · #{session_attached} anexadas  #[bold]%H:%M "
