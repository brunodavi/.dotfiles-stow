# ~/.config/tmux/tmux.conf — dotfiles
# Sem plugins/tpm: funciona em termux, proot e alpine sem nada extra.
# Atalhos de navegação inspirados no oh-my-tmux (gpakosz/.tmux).
#
# CHEAT SHEET (prefixo = Ctrl+a; ? abre o cheat sheet no popup):
#   sessões   s = listar/trocar   C-f = buscar   N = nova (pergunta nome)
#             C-c = nova instantânea   BTab = última sessão
#             T = renomear        K = encerrar   d = sair (detach)
#   janelas   c = nova   C-h/C-l = anterior/próxima   Tab = última   1..9/0
#   painéis   | - dividir   hjkl mover (Alt+hjkl sem prefixo)   HJKL resize
#             z zoom   </> trocar painel de lugar   m = liga/desliga mouse
#   copiar    v selecionar  C-v retângulo  y copiar  p/P colar  Enter cópia
#   ajuda     ? = cheat sheet bonito   / = todos os atalhos (list-keys)
#   config    r = recarregar   e = editar a config (recarrega ao fechar)

# --- prefixo ---------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind a send-prefix        # tmux dentro de tmux: Ctrl+a a manda o C-a adiante

# --- básico ----------------------------------------------------------------
set -g history-limit 50000
set -sg escape-time 0     # sem delay no Esc (vim/neovim respondem na hora)
set -g repeat-time 600
set -g focus-events on
set -g mouse on           # scroll, clique e seleção com o dedo no termux
set -g base-index 1       # janelas começam no 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -ga terminal-overrides ",*:Tc"   # true color (termux/alpine)

# --- painéis: dividir e navegar --------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# sem prefixo também: Alt + hjkl pula de painél direto
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# redimensionar (repetição: segure o prefixo e aperte várias vezes)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- janelas ---------------------------------------------------------------
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- sessões: o pulo do gato pro proot --------------------------------------
# abra várias sessões ("ta teste", "ta experimento") e troque com `s`
# sem sair do proot alpine
bind N command-prompt -p "nome da nova sessão:" "new-session -d -s '%%'\; switch-client -t '%%'"
bind T command-prompt -p "renomear sessão:" "rename-session '%%'"
bind K confirm-before -p "encerrar a sessão '#S'?" "kill-session"

# --- navegação (atalhos do oh-my-tmux) ---------------------------------------
bind C-c new-session                                 # sessão nova na hora
bind C-f command-prompt -p "ir para sessão:" "switch-client -t '%%'"
bind BTab switch-client -l                           # última sessão usada
unbind n
unbind p
bind -r C-h previous-window                          # janela anterior
bind -r C-l next-window                              # janela próxima
bind Tab last-window                                 # última janela usada
bind 0 select-window -t :=10
bind > swap-pane -D                                  # painel com o próximo
bind < swap-pane -U                                  # painel com o anterior
bind m set -gF mouse '#{?mouse,off,on}' \; display "mouse: #{?mouse,on,off}"
# limpa a tela E o histórico (sem prefixo)
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# --- buffers ------------------------------------------------------------------
bind Enter copy-mode
bind p paste-buffer -p                               # colar a última cópia
bind P choose-buffer                                 # escolher qual colar
bind b list-buffers

# --- ajuda --------------------------------------------------------------------
# ? abre o cheat sheet com scroll; / mostra TODOS os atalhos do tmux
bind ? display-popup -E -w 90% -h 92% "less ~/.config/tmux/cheatsheet.txt"
bind / display-popup -E -w 95% -h 95% "tmux list-keys | less"

# --- copiar/colar (modo vi) --------------------------------------------------
setw -g mode-keys vi
set -s set-clipboard on   # osc52: o termux leva a cópia pro clipboard do android
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line
bind -T copy-mode-vi Escape send-keys -X cancel

# --- config --------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"
bind e new-window -n "tmux.conf" "sh -c '#{?E:VISUAL,#{E:VISUAL},#{?E:EDITOR,#{E:EDITOR},vi}} ~/.config/tmux/tmux.conf; tmux source-file ~/.config/tmux/tmux.conf; tmux display \"config recarregada\"'"

# detalhes do oh-my-tmux: título do terminal + mensagens mais visíveis
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g display-time 1000
set -g display-panes-time 800
set -g monitor-activity on

# --- status bar --------------------------------------------------------------
# estilo enxuto: fundo do terminal, cinzas suaves, destaque = negrito/claro
set -g status-interval 5
set -g status-style "bg=default,fg=colour244"

# esquerda: sessão atual em negrito, com folga da borda
set -g status-left-length 40
set -g status-left " #[fg=white]#S#[fg=colour238] | "

# centro: janelas, a atual em negrito claro, deitado em cinza
setw -g window-status-format "#[fg=colour242]#I:#W "
setw -g window-status-current-format "#[fg=colour255]#I:#W#[fg=colour238] "
setw -g window-status-activity-style "none"
setw -g window-status-bell-style "fg=colour255,bold"

# direita: contagens em cinza, com folga da borda (sem hora — o celular já tem)
set -g status-right-length 40
set -g status-right "#[fg=colour242]#{session_windows} janelas | #{session_attached} anexada  "

# painéis, mensagens e seleção combinando com o resto
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour244"
set -g message-style "bg=colour234,fg=white,bold"
set -g message-command-style "bg=colour234,fg=white"
setw -g mode-style "bg=colour238,fg=colour255"
